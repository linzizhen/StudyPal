<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - StudyPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #5BBFAA; --brand-2: #4AA894;
            --brand-grad: linear-gradient(135deg, #6FD3BE, #4AA894);
            --brand-ghost: rgba(91, 191, 170, 0.14);
            --bg: #F4F8FA; --surface: #FFFFFF; --mist: #F6FAFB;
            --ink: #1E2A33; --ink-2: #3D4F5C; --muted: #6B7E8D;
            --line: rgba(30, 42, 51, 0.08);
            --radius: 16px;
            --shadow: 0 1px 2px rgba(30,42,51,.04), 0 12px 30px rgba(30,42,51,.07);
            --font: 'Nunito', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; }
        .header { background: var(--brand-grad); color: #fff; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 20px var(--brand-ghost); }
        .header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
        .header a { color: #fff; text-decoration: none; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.18); transition: background-color .15s ease; }
        .header a:hover { background: rgba(255,255,255,.3); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--surface); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
        .stat-card h3 { color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 10px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: var(--ink); }
        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 20px; border-bottom: 1px solid var(--line); }
        .card-header h2 { font-size: 18px; color: var(--ink); }
        .card-body { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
        th { background: var(--mist); font-weight: 600; color: var(--ink-2); }
        tbody tr:hover { background: var(--mist); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-free { background: #E8F0F2; color: #5F7280; }
        .badge-pro { background: var(--brand-grad); color: #fff; }
        .badge-vip { background: #FFD772; color: #7A5B00; }
        .btn { padding: 6px 14px; border-radius: 999px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font); transition: background-color .15s ease, box-shadow .15s ease, transform .15s ease; }
        .btn-primary { background: var(--brand-grad); color: #fff; box-shadow: 0 6px 16px var(--brand-ghost); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px var(--brand-ghost); }
        .loading { text-align: center; padding: 40px; color: var(--muted); }
        :focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StudyPal 管理后台</h1>
        <a href="/">返回首页</a>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3>总用户数</h3>
                <div class="value" id="total-users">-</div>
            </div>
            <div class="stat-card">
                <h3>今日活跃</h3>
                <div class="value" id="active-users">-</div>
            </div>
            <div class="stat-card">
                <h3>Free 用户</h3>
                <div class="value" id="free-users">-</div>
            </div>
            <div class="stat-card">
                <h3>Pro 用户</h3>
                <div class="value" id="pro-users">-</div>
            </div>
            <div class="stat-card">
                <h3>VIP 用户</h3>
                <div class="value" id="vip-users">-</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>用户列表</h2>
            </div>
            <div class="card-body">
                <div id="user-table-container">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert('请先登录');
            window.location.href = '/login';
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/auth/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) {
                    alert('无权限访问');
                    window.location.href = '/';
                    return;
                }

                const s = data.stats;
                document.getElementById('total-users').textContent = s.total_users;
                document.getElementById('active-users').textContent = s.active_users_today;
                document.getElementById('free-users').textContent = s.subscription_breakdown.free;
                document.getElementById('pro-users').textContent = s.subscription_breakdown.pro;
                document.getElementById('vip-users').textContent = s.subscription_breakdown.vip;
            } catch (err) {
                console.error('加载统计失败', err);
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/auth/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) return;

                const container = document.getElementById('user-table-container');
                if (data.users.length === 0) {
                    container.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">暂无用户</p>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>昵称</th>
                                <th>邮箱</th>
                                <th>会员</th>
                                <th>注册时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.users.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td>${u.nickname}</td>
                                    <td>${u.email}</td>
                                    <td><span class="badge badge-${u.subscription_tier}">${u.subscription_tier.toUpperCase()}</span></td>
                                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                                    <td>
                                        <button class="btn btn-primary" onclick="editUser(${u.id})">编辑</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('加载用户失败', err);
            }
        }

        loadStats();
        loadUsers();
    </script>
</body>
</html>
