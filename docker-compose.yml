# StudyPal 生产环境部署配置
#
# 说明：本应用使用 JSON 文件存储（data/*.json），不依赖外部数据库或缓存服务，
# 因此这里只有一个 web 服务。数据通过卷挂载持久化。
#
# 若将来真的引入数据库或缓存，请在代码中先接入再于此处添加对应服务，
# 避免出现"定义了服务但无人使用"的空跑配置。

services:
  # Web 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studypal-web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      # 多 worker 部署必须显式提供签名密钥：
      # 否则各 worker 会依赖密钥文件的原子创建来协商同一把密钥
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须设置，否则 token 会在重启后失效}
      - AI_API_KEY=${AI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # JSON 数据目录必须挂载出来，否则容器重建即丢数据
      - ./data:/app/data
    networks:
      - studypal-network

networks:
  studypal-network:
    driver: bridge
